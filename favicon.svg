<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vektraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7047EB" />
      <stop offset="100%" stop-color="#9E7AFF" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151F" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#7047EB" stroke-opacity="0.4" stroke-width="2" />

  <!-- Futuristic Geometric 'V' (VeKtra) with automation node flow -->
  <path d="M16 18 L32 46 L48 18" fill="none" stroke="url(#vektraGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Automation flow connector accent inside the V -->
  <path d="M26 23 L32 34 L38 23" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing node dot at vertex -->
  <circle cx="32" cy="46" r="3.5" fill="#00F0FF" />
</svg>
